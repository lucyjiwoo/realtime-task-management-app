{% extends 'shared/layout.html' %}

{% block extracss %}
    <link rel="stylesheet" href="{{ url_for('static', filename='login/css/login.css') }}">
{% endblock %}
{% block extrajs %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js" integrity="sha512-894YE6QWD5I59HgZOGReFYm4dnWc1Qt5NtvYSaNcOP+u1T9qYdvdihz0PPSiiqn/+/3e7Jo4EaG7TubfWGUrMQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="{{ url_for('static', filename='login/js/login.js') }}" defer></script>
{% endblock %}

{% block maincontent %}
<main id="main-login">
    <form class="login-box" id="loginForm" onsubmit="event.preventDefault(); checkCredentials();">
        <div class="login-logo">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="3" width="7" height="18" rx="1.5" fill="currentColor" opacity="0.9"/>
                <rect x="14" y="3" width="7" height="11" rx="1.5" fill="currentColor" opacity="0.7"/>
                <rect x="14" y="17" width="7" height="4" rx="1.5" fill="currentColor" opacity="0.5"/>
            </svg>
            <span class="login-logo-text">TaskFlow</span>
        </div>
        <p class="login-text">Sign in to your workspace</p>

        <label class="login-label" for="email">Email</label>
        <input class="login-input" type="email" id="email" name="email" placeholder="you@example.com" required>

        <label class="login-label" for="password">Password</label>
        <input class="login-input" type="password" id="password" name="password" placeholder="••••••••" required>

        <button id="login-btn" type="submit">Log In</button>

        <div class="login-divider">or</div>

        <button id="signup-btn" type="button" onclick="validateSignUp()">Create an account</button>
        <p id="feedback"></p>
    </form>
</main>
{% endblock %}
